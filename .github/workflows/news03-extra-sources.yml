name: News03 additional source metadata - NO DEPLOY
on:
  push:
    branches: [news/coverage-originality-20260926-03]
    paths: ['audit/news03_extra_probe.py', '.github/workflows/news03-extra-sources.yml']
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1 feedparser==6.0.11
      - run: |
          test "$GITHUB_REF" = refs/heads/news/coverage-originality-20260926-03
          mkdir -p evidence
          git rev-parse HEAD > evidence/candidate-sha.txt
          python audit/news03_extra_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news03-extra-source-metadata
          path: evidence
          retention-days: 30
