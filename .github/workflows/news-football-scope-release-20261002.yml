name: Football News competition identity release 20261002
on:
  push:
    branches: [audit/news-football-20261002]
    paths: [.github/workflows/news-football-scope-release-20261002.yml]
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      NINKO_SKIP_STARTUP_INDEX: '1'
      NINKO_SKIP_INTEGRITY_BACKFILL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: bundle
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ops/news-free-probe-20260926
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply only checksum-verified News identity changes
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = '753b0ad8a89a4a4bef6aab90aa50439085fe3311'
          mkdir -p ../scope-evidence
          python - <<'PY'
          import shutil,hashlib,json
          from pathlib import Path
          shutil.copyfile('../bundle/audit/news_competition_scope.py','bot/news_competition_scope.py')
          shutil.copyfile('../bundle/audit/test_news_competition_scope.py','tests/test_news_competition_scope.py')
          p=Path('bot/news_fact_guard.py');s=p.read_text()
          s=s.replace('from .news_policy import original_draft_reason','from .news_policy import original_draft_reason\nfrom .news_competition_scope import conflicting_competition_qualifier')
          start=s.index('    if any(re.search(',s.index('def competition_in_source'))
          end=s.index('    # Exact language equivalents',start)
          block='\n'.join([
              "    for alias in meta.get('aliases', []):",
              '        if not alias.strip():',
              '            continue',
              r"        pattern = r'(?<!\w)' + r'\s+'.join(re.escape(part) for part in alias.strip().split()) + r'(?!\w)'",
              "        for match in re.finditer(pattern, text or '', re.I):",
              "            if not conflicting_competition_qualifier(competition, text or '', match.start(), match.end()):",
              '                return True',
              '',
          ])
          s=s[:start]+block+s[end:]
          s=s.replace("        before = (text or '')[max(0, match.start()-25):match.start()]", "        if conflicting_competition_qualifier(competition, text or '', match.start(), match.end()):\n            continue\n        before = (text or '')[max(0, match.start()-25):match.start()]")
          s=s.replace('            and classified.league\n            and classified.confidence', '            and classified.league\n            # "football-international" means no concrete league was found,\n            # not positive evidence that the draft describes another event.\n            and classified.league not in set(BROAD_LEAGUE.values()) | {f"{expected_sport}-international"}\n            and classified.confidence')
          p.write_text(s)
          p=Path('bot/news_football_sections.py');s=p.read_text()
          s=s.replace('from .news_football_memberships import memberships_for_news','from .news_football_memberships import memberships_for_news\nfrom .news_competition_scope import conflicting_competition_qualifier')
          s=s.replace('                before = text[max(0, match.start()-65):match.start()]','                if conflicting_competition_qualifier(key, text, match.start(), match.end()):\n                    continue\n                before = text[max(0, match.start()-65):match.start()]')
          p.write_text(s)
          expected={'bot/news_competition_scope.py':'720a41b992d63d4e87b49e7292d7b1ee3794e03d5ddd6e50dab770c9bdb9417f','bot/news_fact_guard.py':'62f72d9615b9a8b2699734f1d032d8c5d5d0a876c092f3beb3edc97ea6b9be0f','bot/news_football_sections.py':'7e07f7525a22a0398674538b2548cd7a31f1ddb3f0cea4a7162c51cec6cf3db6','tests/test_news_competition_scope.py':'9332f42a7c96eb2c33e73bdefd6c1bc5c8f54755e296b319d208d5dafbc65d91'}
          actual={path:hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in expected}
          Path('../scope-evidence/hashes.json').write_text(json.dumps(actual,indent=2))
          assert actual==expected,actual
          PY
      - name: All News regressions on an isolated database
        working-directory: source
        run: |
          pip install -q -r requirements.txt
          python -m pytest -q tests/test_news* --junitxml=../scope-evidence/tests.xml > ../scope-evidence/tests.txt 2>&1 || { tail -100 ../scope-evidence/tests.txt; exit 1; }
          tail -3 ../scope-evidence/tests.txt
          python -m compileall -q bot
      - name: Persist clean tested release without unrelated changes
        working-directory: source
        run: |
          git add bot/news_competition_scope.py bot/news_fact_guard.py bot/news_football_sections.py tests/test_news_competition_scope.py
          test "$(git diff --cached --name-only | wc -l)" = '4'
          git config user.name 'NinkoSports News validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(news): preserve continental qualifiers and reject only concrete competition contradictions'
          git push origin HEAD:refs/heads/audit/news-football-scope-release-20261002
          git rev-parse HEAD > ../scope-evidence/tested-commit.txt
          git show --stat --oneline HEAD > ../scope-evidence/commit.txt
      - name: Retain reviewable source and patch even if a test fails
        if: always()
        working-directory: source
        run: |
          mkdir -p ../scope-evidence
          git diff > ../scope-evidence/uncommitted.patch
          tar -czf ../scope-evidence/review-source.tar.gz --exclude=.git --exclude=__pycache__ --exclude=.pytest_cache .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-news-scope-release-20261002
          path: scope-evidence/
          retention-days: 7
