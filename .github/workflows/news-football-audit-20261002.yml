name: News football read-only audit 20261002
on:
  push:
    branches: [audit/news-football-20261002]
    paths: [.github/workflows/news-football-audit-20261002.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture tracked source and public read endpoints
        run: |
          mkdir -p audit-export
          git archive --format=tar HEAD > audit-export/backend-source.tar
          python - <<'PY'
          import json, pathlib, urllib.request
          root = pathlib.Path('audit-export')
          urls = {
              'openapi': 'https://allball-backend-production.up.railway.app/openapi.json',
              'health': 'https://allball-backend-production.up.railway.app/health',
              'homepage': 'https://ninkosports.com/',
          }
          summary = {}
          for name, url in urls.items():
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'NinkoSports-News-Audit/1.0'})
                  with urllib.request.urlopen(req, timeout=25) as response:
                      data = response.read(3000000)
                      summary[name] = {'status': response.status, 'bytes': len(data)}
                  (root / (name + '.txt')).write_bytes(data)
              except Exception as exc:
                  summary[name] = {'error_type': type(exc).__name__}
          (root / 'baseline.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: news-football-baseline-20261002
          path: audit-export/
          retention-days: 3
          if-no-files-found: error
