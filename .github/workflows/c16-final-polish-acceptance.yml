name: C16 final polished competition journey
on:
  push:
    branches: [audit/football-recovery-20260925-10]
    paths: ['.github/workflows/c16-final-polish-acceptance.yml']
permissions:
  contents: read
  actions: read
jobs:
  full-competition-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 36138186962
          artifact-ids: 10865469504
          merge-multiple: true
          path: /tmp/previous-execution
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 36126017633
          artifact-ids: 10859673405
          merge-multiple: true
          path: /tmp/c15-baseline
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 36129893421
          artifact-ids: 10861511746
          merge-multiple: true
          path: /tmp/c16-before-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/previous-execution/executed_acceptance.py').read_text()
          needle="            page.evaluate('window.scrollTo(0,0)');page.screenshot(path=str(OUT/f'h2h-{width}.png'),full_page=True)"
          assert s.count(needle)==1
          s=s.replace(needle,'''            geometry=page.evaluate("""() => [...document.querySelectorAll('.h2h-meetings-card .history-league')].map(x=>{const a=x.getBoundingClientRect(),p=x.parentElement.querySelector('.h2h-history-pair').getBoundingClientRect();return {text:x.textContent,width:a.width,height:a.height,top:a.top,pairBottom:p.bottom};})""")
                      assert geometry
                      if width<=760:assert all(g['width']>=140 and g['height']<=36 and g['top']>=g['pairBottom']-1 for g in geometry),geometry
                      result['history_label_geometry']=geometry
          '''.replace('                      ','            ')+needle)
          compile(s,'/tmp/c16-polished.py','exec');Path('/tmp/c16-polished.py').write_text(s)
          out=Path('/tmp/c16-public');out.mkdir(exist_ok=True);(out/'executed_acceptance.py').write_text(s)
          PY
          python /tmp/c16-polished.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c16-polished-competition-history
          path: /tmp/c16-public
          retention-days: 30
  future-match-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          mkdir -p /tmp/c16-future
          python - <<'PY'
          import json,re,urllib.request,unicodedata
          from pathlib import Path
          from datetime import datetime,timezone
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright
          out=Path('/tmp/c16-future');api='https://allball-backend-production.up.railway.app';site='https://ninkosports.com';key='ireland-premier-division';mid='5100973'
          def get(name,url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Accept':'application/json'}),timeout=40) as r:d={'http':r.status,'url':url,'payload':json.load(r),'at':datetime.now(timezone.utc).isoformat()}
              (out/(name+'.json')).write_text(json.dumps(d,ensure_ascii=False,indent=2));return d['payload']
          public=get('future-comparison',api+'/sports-data/competitions/'+key+'/comparison?'+urlencode({'match':'reference:'+mid}))
          native=get('native-future','https://www.fotmob.com/api/data/matchDetails?matchId='+mid)
          event=public.get('event') or {};history=public.get('h2h') or [];form=public.get('form') or {}
          assert public['available'] and event['key']=='reference:'+mid and event.get('id') is None and event['status']=='scheduled'
          assert event['home']['name']=='Dundalk' and event['away']['name']=='Bohemian FC' and history
          def norm(s):return ''.join(c for c in unicodedata.normalize('NFKD',str(s)).casefold() if c.isalnum())
          def stamp(s):return datetime.fromisoformat(s.replace('Z','+00:00')).replace(tzinfo=None)
          native_rows=(native.get('content',{}).get('h2h') or {}).get('matches') or []
          for r in history:
              matches=[n for n in native_rows if all(norm(n[side]['name'])==norm(r[side]['name']) for side in ('home','away')) and abs((stamp(n['status']['utcTime'])-stamp(r['start_time'])).total_seconds())<=60]
              assert len(matches)==1
              score=re.fullmatch(r'\s*(\d+)\s*[-–]\s*(\d+)\s*',matches[0]['status'].get('scoreStr',''))
              assert score and [int(score[1]),int(score[2])]==[r['score']['home'],r['score']['away']]
              assert stamp(r['start_time'])<stamp(event['start_time']) and r['status']=='finished'
          assert all(1<=len(form.get(side,{}).get('results',[]))<=5 for side in ('home','away'))
          expected=[0,0,0]
          for r in history:
              a,b=r['score']['home'],r['score']['away']
              if norm(r['home']['name'])!=norm(event['home']['name']):a,b=b,a
              expected[0 if a>b else 1 if a==b else 2]+=1
          report={'at':datetime.now(timezone.utc).isoformat(),'event':event,'history':len(history),'summary':expected,'form':{s:len(form[s]['results']) for s in ('home','away')},'browser':[]}
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for width in (1440,390,320):
                  ctx=browser.new_context(viewport={'width':width,'height':1000},timezone_id='Australia/Sydney');page=ctx.new_page();errors=[];requests=[]
                  page.on('pageerror',lambda e:errors.append(str(e)));page.on('response',lambda r:requests.append(r.url) if '/sports-data/' in r.url else None)
                  page.goto(site+'/scores/competition/'+key+'/standings?sport=football&tab=fixtures',wait_until='domcontentloaded')
                  row=page.locator('.hub-fixture-row[data-match-key="reference:'+mid+'"]');row.wait_for(timeout=45000)
                  assert row.locator('.hub-fixture-pair').evaluate('(e)=>e.tagName')!='A'
                  row.locator('.hub-compare-button').click();page.locator('.h2h-summary-card').wait_for(timeout=45000)
                  values=page.locator('.h2h-summary-grid strong').all_text_contents()
                  assert values==[str(v) for v in expected] and not errors
                  assert page.locator('.mc-hero').count()==0 and page.locator('.hub-match-detail-link').count()==0
                  assert not page.evaluate('document.documentElement.scrollWidth>innerWidth+1')
                  assert not any('/sports-data/matches/' in u for u in requests)
                  page.screenshot(path=str(out/f'future-h2h-{width}.png'),full_page=True)
                  report['browser'].append({'width':width,'pass':True,'summary':values,'errors':errors,'no_fake_full_match_link':True,'requests':requests});ctx.close()
              browser.close()
          (out/'acceptance.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c16-future-reference-comparison
          path: /tmp/c16-future
          retention-days: 30
