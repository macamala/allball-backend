name: Deployed screenshot production acceptance
on:
  push:
    branches: [audit/football-recovery-20260925-10]
    paths: ['audit/screenshot_production_acceptance.py', '.github/workflows/screenshot-production-acceptance.yml']
permissions:
  contents: read
jobs:
  actual-public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: macamala/allball-frontend
          ref: 99653b3e9af022cfedc430b43e94466720783d57
          path: frontend
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Actual public scores, alias identity and refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('audit/screenshot_production_acceptance.py');s=p.read_text()
          # Initial Sep26 check in run36095253012 observed only loading skeletons:
          # those also have .score-row. Wait for real links; keep all assertions.
          s=s.replace("main.locator('.score-row').first.wait_for", "main.locator('.score-row-link').first.wait_for")
          s=s.replace("page.locator('.score-centre-main .score-row').first.wait_for", "page.locator('.score-centre-main .score-row-link').first.wait_for")
          old="   REPORT['browser'][-1]['poll_responses']=requests[before:]"
          new=old+"\n   assert any('/status-delta?' in r['url'] and r['status']==200 for r in requests[before:]), 'No actual delta poll'\n   assert any('/events?' in r['url'] and r['status']==200 for r in requests[before:]), 'No actual full refresh'"
          assert old in s;s=s.replace(old,new)
          p.write_text(s)
          PY
          python audit/screenshot_production_acceptance.py
      - name: Retain previously repaired mobile standings and group switching
        if: always()
        env:
          MOBILE_QA_SITE: https://ninkosports.com
          MOBILE_QA_OUT: /tmp/screenshot-after/standings
        run: python frontend/audit/mobile_standings_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-production-acceptance
          path: /tmp/screenshot-after
          retention-days: 30
