name: Football News normal-cycle publication observation 20261003
on:
  push:
    branches: [audit/news-throughput-20261003]
    paths: [.github/workflows/news-completion-publication-observation-20261003.yml]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8f474371ac8001ecfeb0438f5020f79312f19339
          persist-credentials: false
      - name: Observe only public GETs while the already-running worker processes its normal cycle
        run: |
          mkdir -p publication-observation
          python - <<'PY'
          import json,pathlib,urllib.request,urllib.parse,time
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime,timezone
          root=pathlib.Path('publication-observation');base='https://allball-backend-production.up.railway.app';observations=[]
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'NinkoSports-News-ReadAudit/1.0'})
              with urllib.request.urlopen(req,timeout=15) as response:return json.loads(response.read(4000000))
          def read(key,limit=3):
              result={'league':key}
              try:
                  rows=get('/articles?'+urllib.parse.urlencode({'sport':'football','league':key,'limit':limit}))
                  assert isinstance(rows,list)
                  result['articles']=[{k:a.get(k) for k in ['id','slug','title','sport','league','published_at','created_at','image_url']} for a in rows]
              except Exception as exc:result['error']=type(exc).__name__+': '+str(exc)[:100]
              return result
          targets=['england-championship','japan-j1-league','japan-j2-league']
          for iteration in range(9):
              with ThreadPoolExecutor(max_workers=2) as pool:rows=list(pool.map(read,targets))
              observations.append({'checked_at':datetime.now(timezone.utc).isoformat(),'menus':rows})
              (root/'observations.json').write_text(json.dumps(observations,ensure_ascii=False,indent=2))
              if all(row.get('articles') for row in rows):break
              if iteration<8:time.sleep(30)
          catalog=json.loads(pathlib.Path('bot/news_football_leagues.json').read_text())
          with ThreadPoolExecutor(max_workers=3) as pool:menus=list(pool.map(lambda row:read(row['league']),catalog))
          now=datetime.now(timezone.utc)
          def fresh(article):
              try:
                  stamp=datetime.fromisoformat(str(article.get('published_at')).replace('Z','+00:00'))
                  stamp=stamp.replace(tzinfo=timezone.utc) if stamp.tzinfo is None else stamp.astimezone(timezone.utc)
                  return 0<=(now-stamp).total_seconds()<86400
              except (ValueError,TypeError):return False
          summary={'checked_at':now.isoformat(),'menus':len(menus),'populated':sum(bool(row.get('articles')) for row in menus),
              'fresh_menus':sum(any(fresh(a) for a in row.get('articles',[])) for row in menus),
              'empty':[row['league'] for row in menus if row.get('articles')==[]],
              'wrong_fields':sum(a.get('league')!=row['league'] or a.get('sport')!='football' for row in menus for a in row.get('articles',[])),
              'missing_image_urls':sum(not a.get('image_url') for row in menus for a in row.get('articles',[])),
              'errors':[row for row in menus if row.get('error')],
              'observed_target_menus':[row for row in menus if row['league'] in targets],
              'AI_requests':0,'publication_triggers':0,'sports_write_requests':0,'all_football_news_complete':False}
          (root/'menus.json').write_text(json.dumps(menus,ensure_ascii=False,indent=2))
          (root/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          assert len(menus)==86 and not summary['errors'] and not summary['wrong_fields']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-completion-publication-observation-20261003
          path: publication-observation/
          retention-days: 7
