name: News02 recovery image and regressions - NO DEPLOY
on:
  push:
    branches: [news/isolated-20260926-01]
    paths:
      - '.github/workflows/news02-recovery.yml'
      - 'deploy/news/**'
      - 'bot/extract.py'
      - 'tests/test_news_feed_dates.py'
      - 'tests/test_news_deploy_contract.py'
permissions:
  contents: read
concurrency:
  group: news02-isolated-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check exact isolated scope
        run: |
          test "$GITHUB_REF" = refs/heads/news/isolated-20260926-01
          mkdir -p evidence
          git rev-parse HEAD > evidence/candidate-sha.txt
          git diff --check cf192f22da637b9b54495cd5fc2ba238abbfbee3 HEAD
          python - <<'PY'
          from pathlib import Path
          import subprocess,hashlib,json
          allowed={'.github/workflows/news02-recovery.yml','deploy/news/Dockerfile','deploy/news/preflight.py','bot/extract.py','tests/test_news_feed_dates.py','tests/test_news_deploy_contract.py'}
          changed=set(subprocess.check_output(['git','diff','--name-only','cf192f22da637b9b54495cd5fc2ba238abbfbee3','HEAD'],text=True).splitlines())
          assert changed==allowed,(changed,allowed)
          Path('evidence/source-SHA256.json').write_text(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in sorted(changed)},indent=2))
          PY
          git archive --format=tar.gz HEAD > evidence/tested-source.tar.gz
      - name: Build only the explicitly selected News image
        run: |
          docker build --progress=plain -f deploy/news/Dockerfile -t ninko-news02:gate . 2>&1 | tee evidence/docker-build.log
          docker image inspect ninko-news02:gate > evidence/image-inspect.json
          docker image inspect python:3.12-slim-bookworm > evidence/base-image-inspect.json
          docker run --rm --network none ninko-news02:gate python -m pip freeze > evidence/pip-freeze.txt
      - name: Actual image preflight and fail-closed default, without network or secrets
        run: |
          docker run --rm --network none ninko-news02:gate python deploy/news/preflight.py --check > evidence/image-preflight.json
          set +e
          docker run --rm --network none ninko-news02:gate > evidence/default-start.json 2> evidence/default-start.stderr
          result=$?
          set -e
          test "$result" -eq 78
          docker run --rm --network none -e DATABASE_URL=sqlite:///:memory: ninko-news02:gate python -c 'import sys,importlib.util,json; import bot.scheduler; import repair_content; assert "collector.worker" not in sys.modules; assert importlib.util.find_spec("collector") is None; print(json.dumps({"news_imports":True,"collector_absent":True,"scheduler_executed":False,"database":"ephemeral SQLite configuration only"}))' > evidence/image-import-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('evidence/image-preflight.json').read_text())
          b=json.loads(Path('evidence/default-start.json').read_text())
          assert a['artifact_ready'] and not a['news_started'] and not a['runtime_health_verified']
          assert not b['ready_for_requested_mode'] and 'news_worker_not_explicitly_enabled' in b['errors']
          assert not b['news_started'] and not b['runtime_health_verified']
          PY
      - name: Reproduce original publication-date failures offline
        run: |
          cp bot/extract.py /tmp/news02-candidate-extract.py
          trap 'cp /tmp/news02-candidate-extract.py bot/extract.py' EXIT
          git show cf192f22da637b9b54495cd5fc2ba238abbfbee3:bot/extract.py > bot/extract.py
          set +e
          docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD:/work:ro" -v "$PWD/evidence:/evidence" -w /work ninko-news02:gate python -m pytest -q -p no:cacheprovider tests/test_news_feed_dates.py --junitxml=/evidence/date-baseline.xml > evidence/date-baseline.log 2>&1
          result=$?
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as E
          t=E.parse('evidence/date-baseline.xml')
          assert len(list(t.iter('testcase')))==20
          assert len(list(t.iter('failure')))==13
          assert not list(t.iter('error')) and not list(t.iter('skipped'))
          print('NEWS02_BASELINE 20 tests / 13 reproduced failures / 0 errors')
          PY
      - name: Full retained football selection and News regressions offline
        run: |
          git diff --exit-code -- bot/extract.py
          python - <<'PY'
          from pathlib import Path
          retained=Path('audit/football_test_selection.txt').read_text().split()
          retained += '''tests/test_hidden_football_aliases.py tests/test_fotmob_match_centre.py tests/test_entity_profile_navigation.py tests/test_c14_live_player.py tests/test_canonical_detail.py tests/test_fiba_rich_detail.py tests/test_sofa_rich_detail.py tests/test_c15_live_tables.py tests/test_c15_parent_league_tables.py tests/test_worker_shutdown_handoff.py tests/test_c16_competition_hub.py tests/test_c16_identity_lookup.py tests/test_c17_categories_scorers.py tests/test_c17_review_regressions.py tests/test_c17_production_followup.py tests/test_c17_profile_dates.py tests/test_c17_team_categories.py tests/test_c17_exact_team_id.py tests/test_auth.py tests/test_editorial.py tests/test_rewrite_ai.py tests/test_public_read.py tests/test_taxonomy_resolver.py tests/test_taxonomy_leakage.py tests/test_news_feed_dates.py tests/test_news_deploy_contract.py'''.split()
          retained=list(dict.fromkeys(retained))
          assert all(Path(p).is_file() for p in retained)
          Path('evidence/test-selection.txt').write_text('\n'.join(retained)+'\n')
          PY
          docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD:/work:ro" -v "$PWD/evidence:/evidence" -w /work ninko-news02:gate python -m pytest -q -p no:cacheprovider $(cat evidence/test-selection.txt) --junitxml=/evidence/tests.xml 2>&1 | tee evidence/tests.log
      - name: Actual pinned feedparser Atom and RSS date contract offline
        run: |
          docker run --rm -i --network none -e DATABASE_URL=sqlite:///:memory: ninko-news02:gate python - <<'PY' > evidence/feedparser-contract.json
          import json, feedparser
          from datetime import datetime, timezone
          from bot.extract import parse_feed_datetime
          atom=b'<feed xmlns="http://www.w3.org/2005/Atom"><title>Offline</title><entry><title>Fixture</title><id>fixture</id><published>2026-09-19T08:30:00+10:00</published><updated>2026-09-26T00:00:00Z</updated></entry></feed>'
          rss=b'<rss version="2.0"><channel><title>Offline</title><item><title>Fixture</title><pubDate>Sat, 26 Sep 2026 08:30:00 +1000</pubDate></item></channel></rss>'
          results=[]
          for raw,expected in [(atom,datetime(2026,9,18,22,30,tzinfo=timezone.utc)),(rss,datetime(2026,9,25,22,30,tzinfo=timezone.utc))]:
              parsed=feedparser.parse(raw)
              assert len(parsed.entries)==1
              value=parse_feed_datetime(parsed.entries[0])
              assert value==expected and value.tzinfo==timezone.utc
              results.append(value.isoformat())
          assert feedparser.__version__=='6.0.11'
          print(json.dumps({'feedparser':feedparser.__version__,'tests':2,'passed':True,'timestamps':results,'network':False}))
          PY
      - name: Verify final source and summarize evidence
        if: always()
        run: |
          git diff --exit-code -- bot/extract.py
          python - <<'PY'
          import json,hashlib,xml.etree.ElementTree as E
          from pathlib import Path
          expected=json.loads(Path('evidence/source-SHA256.json').read_text())
          assert all(hashlib.sha256(Path(p).read_bytes()).hexdigest()==digest for p,digest in expected.items())
          p=Path('evidence/tests.xml')
          if p.exists():
              tree=E.parse(p)
              summary={k:len(list(tree.iter(v))) for k,v in [('tests','testcase'),('failures','failure'),('errors','error'),('skipped','skipped')]}
              Path('evidence/test-summary.json').write_text(json.dumps(summary,indent=2))
              print('NEWS02_TEST_SUMMARY '+json.dumps(summary))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news02-recovery-image-evidence
          path: evidence
          retention-days: 30
