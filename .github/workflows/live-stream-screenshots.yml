name: Screenshot live stream backend gate
on:
  push:
    branches: [fix/live-stream-screenshots-20260925]
    paths: ['audit/apply_live_stream_screenshots.py', '.github/workflows/live-stream-screenshots.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python audit/apply_live_stream_screenshots.py
      - run: python -m pip install -r requirements.txt
      - run: |
          mkdir -p /tmp/live-stream-backend
          python -m compileall -q collector tests app.py
          python -m pytest -q $(cat audit/football_test_selection.txt) --disable-warnings --junitxml=/tmp/live-stream-backend/tests.xml
      - if: always()
        run: |
          mkdir -p /tmp/live-stream-backend
          git add -N collector tests
          git diff --binary > /tmp/live-stream-backend/source.patch
          sha256sum /tmp/live-stream-backend/source.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-stream-backend-evidence
          path: /tmp/live-stream-backend
          retention-days: 30
  publish-tested-source:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: |
          python audit/apply_live_stream_screenshots.py
          git add collector tests app.py audit/football_test_selection.txt
          git config user.name 'NinkoSports regression checks'
          git config user.email '79318740+macamala@users.noreply.github.com'
          git commit -m 'Reject premature football LIVE and publish canonical paged status changes with retirements'
          git push origin HEAD:fix/live-stream-screenshots-20260925
          echo "TESTED_SOURCE_COMMIT=$(git rev-parse HEAD)"
