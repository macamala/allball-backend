name: News Scottish source and index gate
on:
  push:
    branches: [audit/news-football-completion-20261004]
    paths:
      - .github/workflows/news-scottish-source-gate-20261004.yml
      - audit/apply_news_scottish_desks_20261004.py
      - tests/test_news_scottish_club_desks_20261004.py
      - bot/news_scottish_club_desks.py
permissions:
  contents: write
concurrency:
  group: news-scottish-source-audit-20261004
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      NEWS_ACCOUNTING_BACKEND: memory
      NEWS_WORKER_ENABLED: '0'
      RESULTS_COLLECTION_ENABLED: 'false'
      RESULTS_WRITE_ENABLED: 'false'
      RESULTS_SCHEDULER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -q -r requirements.txt
      - name: Integrate only reviewed News extraction and source registration
        run: |
          python audit/apply_news_scottish_desks_20261004.py
          git diff --check
          python - <<'PY'
          import subprocess
          allowed={'bot/extract.py','bot/news_scottish_club_desks.py','bot/news_football_sources.py','bot/news_football_regional_desks.py'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed <= allowed,changed-allowed
          print('NEWS_ONLY_SCOPED_SOURCE_FILES',sorted(changed))
          PY
      - name: Retained News regressions plus source-bound Scottish cases
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings tests/test_news*.py tests/test_editorial*.py tests/test_rewrite*.py tests/test_public*.py tests/test_taxonomy*.py --tb=short | tee news-scottish-tests.txt
      - name: Bounded real source checks without database writes or AI
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from bot.news_scottish_club_desks import fetch_scottish_article
          from bot.extract import article_text_from_html,collect_page_image_candidates,page_published_at_from_html
          from bot.news_image_http import probe_news_images
          from bot.news_policy import news_freshness_reason
          from bot.news_official_indexes import HTML_INDEXES,_anchor_candidates,_hydrate
          from bot.news_index_selection import discovery_config
          sources=['https://www.motherwellfc.co.uk/2026/10/02/next-up-aberdeen-h-4/','https://www.motherwellfc.co.uk/2026/10/02/jake-girdwood-reich-feeling-at-home/','https://kilmarnockfc.co.uk/news/dave-richards-arrives-in-ayrshire/']
          proof={'source_checks':[],'simulated_known_prefix_checks':[],'production_modified':False,'ai_calls':0}
          for url in sources:
              handled,html=fetch_scottish_article(url)
              body=article_text_from_html(html);photos=collect_page_image_candidates(html)
              date=page_published_at_from_html(html)
              checks=probe_news_images([row['url'] for row in photos],max_workers=1)
              row={'url':url,'handled':handled,'body_words':len(body.split()),'source_date':str(date),'freshness_reason':news_freshness_reason(date),'body_start':body[:160],'photos':photos,'image_checks':checks}
              proof['source_checks'].append(row)
              assert handled and body and date and photos,'Exact source body/date/photo not verified'
              if 'jake-girdwood' in url:assert 'Rowena Armitage' not in body and 'Matchday seven' not in body,'Neighbor contamination'
              if 'next-up-aberdeen' in url:assert 'Jake Girdwood-Reich' not in body,'Neighbor contamination'
              print('EXACT_ARTICLE_SOURCE',json.dumps(row),flush=True)
          for name in ('sweden-allsvenskan-category','sweden-superettan-category','mls-official-news','eredivisie-official-news'):
              cfg=next(c for c in HTML_INDEXES if c['id']==name)
              first=_anchor_candidates(cfg)
              more=_anchor_candidates(discovery_config(cfg,[url for url,_ in first]))
              row={'id':name,'simulated_known_prefix':[url for url,_ in first],'next_links':[url for url,_ in more],'next_article_checks':[]}
              assert not set(row['simulated_known_prefix']).intersection(row['next_links'])
              assert len(more)<=8
              for url,title in more[:3]:
                  reasons=Counter();item=_hydrate(cfg,url,title,diagnostics=reasons)
                  row['next_article_checks'].append({'url':url,'eligible_source':bool(item),'reasons':dict(reasons),'source_date':str(item.get('published_at')) if item else None,'title':item.get('title') if item else title})
              proof['simulated_known_prefix_checks'].append(row)
              print('INDEX_AFTER_PREFIX',json.dumps(row),flush=True)
          Path('news-real-source-proof.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2))
          PY
      - name: Save tested source integration on audit branch only
        run: |
          test "$GITHUB_REF_NAME" = 'audit/news-football-completion-20261004'
          git config user.name 'NinkoSports News maintenance'
          git config user.email '79318740+macamala@users.noreply.github.com'
          git add bot/extract.py bot/news_scottish_club_desks.py bot/news_football_sources.py bot/news_football_regional_desks.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat(news): bind Scottish club copy and photographs to the exact requested article'
            git push origin HEAD:refs/heads/audit/news-football-completion-20261004
          fi
          git rev-parse HEAD | tee tested-news-commit.txt
          git archive --format=zip --output=tested-news-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-scottish-source-tested-evidence
          path: |
            news-scottish-tests.txt
            news-real-source-proof.json
            tested-news-commit.txt
            tested-news-source.zip
          retention-days: 7
