name: Football News native sources and recovery 20261003
on:
  push:
    branches: [audit/news-throughput-20261003]
    paths: [.github/workflows/news-native-resilience-20261003.yml]
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      NINKO_SKIP_STARTUP_INDEX: '1'
      NINKO_SKIP_INTEGRITY_BACKFILL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: bundle
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ops/news-free-probe-20260926
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q PyYAML
      - name: Run checksum-pinned native release with bounded retry regression gate
        run: |
          python - <<'PY'
          import pathlib,subprocess,yaml,base64,gzip,hashlib,json
          workflow=yaml.safe_load(pathlib.Path('bundle/.github/workflows/news-native-release-20261003.yml').read_text())
          steps=[step for step in workflow['jobs']['gate']['steps'] if 'run' in step]
          assert len(steps)==4
          subprocess.run(['bash','-e','-c',steps[0]['run']],cwd='source',check=True)
          encoded=pathlib.Path('bundle/audit/news-membership-retry-20261003.patch.b64').read_text().strip()
          pathlib.Path('native-evidence/retry-received.b64').write_text(encoded)
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='210e4c32477e2185dc316e5c93c0e3c738ef3cf68f8b3332400a20219c0e57c0'
          path=pathlib.Path('native-evidence/retry.patch');path.write_bytes(patch)
          subprocess.run(['git','apply','--check','../'+str(path)],cwd='source',check=True)
          subprocess.run(['git','apply','../'+str(path)],cwd='source',check=True)
          subprocess.run(['bash','-e','-c',steps[1]['run']],cwd='source',check=True)
          proof=steps[2]['run']
          proof=proof.replace('refresh_football_news_memberships()','membership_refresh = refresh_football_news_memberships()')
          proof=proof.replace("from bot.news_football_sections import football_news_section", "from bot.news_football_sections import football_news_section\nfrom bot import news_football_memberships as memberships")
          old="result={'checked_at':datetime.now(timezone.utc).isoformat(),'sources':rows,"
          new="""diagnostics = {}
          try:
              raw = memberships._public_fixture_get('england-championship','england-championship')
              parsed = memberships.parse_fixture_membership('england-championship',raw)
              diagnostics = {'competition':raw.get('competition'),'available':raw.get('available'),
                  'coverage':raw.get('coverage'),'checked_at':raw.get('checked_at'),'event_count':len(raw.get('events',[])),
                  'parsed_roster':parsed}
              (root/'championship-hub.json').write_text(json.dumps(raw,ensure_ascii=False))
          except Exception as exc:
              diagnostics = {'error_type':type(exc).__name__}
          roster = memberships.memberships_for_news().get('england-championship',{})
          has_verified_burnley = 'Burnley' in memberships.verified_name_aliases(roster.get('clubs',[]))
          result={'membership_refresh':membership_refresh,'championship_diagnostics':diagnostics,
                  'verified_burnley_roster_present':has_verified_burnley,
                  'checked_at':datetime.now(timezone.utc).isoformat(),'sources':rows,"""
          assert proof.count(old)==1
          proof=proof.replace(old,new)
          old="assert association=='england-championship',association"
          new="""# A missing live roster must remain unknown, not become a false
          # Italian association. Deterministic tests require Championship when
          # the verified Burnley roster is present; source availability is reported.
          assert association == ('england-championship' if has_verified_burnley else None),association"""
          assert proof.count(old)==1
          proof=proof.replace(old,new)
          subprocess.run(['bash','-e','-c',proof],cwd='source',check=True)
          allowed={'bot/news_jleague_native.py','bot/news_official_indexes.py','bot/news_football_sources.py',
              'bot/news_football_priority.py','bot/news_football_sections.py','bot/news_football_memberships.py',
              'tests/test_news_football_sources_20261002.py','tests/test_news_jleague_native.py',
              'tests/test_news_transfer_primary_subject.py','tests/test_news_membership_retry.py'}
          tracked=set(subprocess.check_output(['git','diff','--name-only'],cwd='source',text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],cwd='source',text=True).splitlines())
          assert tracked|untracked==allowed,(tracked|untracked)^allowed
          pathlib.Path('native-evidence/final-files.json').write_text(json.dumps({f:hashlib.sha256((pathlib.Path('source')/f).read_bytes()).hexdigest() for f in sorted(allowed)},indent=2))
          save=steps[3]['run']
          save=save.replace('git add bot/news_jleague_native.py','git add bot/news_football_memberships.py tests/test_news_membership_retry.py bot/news_jleague_native.py')
          save=save.replace("= '8'","= '10'")
          save=save.replace('admit verified native J1 J2 reporting and preserve primary transfer subjects','admit native J1 J2 reporting and recover transient roster reads without sports writes')
          subprocess.run(['bash','-e','-c',save],cwd='source',check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-native-resilience-20261003
          path: native-evidence/
          retention-days: 7
