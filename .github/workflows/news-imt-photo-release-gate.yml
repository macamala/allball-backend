name: News IMT and photo release gate
on:
  push:
    branches: [audit/news-football-completion-20261004]
    paths:
      - .github/workflows/news-imt-photo-release-gate.yml
      - audit/apply_news_imt_repair_20261004.py
      - tests/test_news_imt_repair_20261004.py
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      NEWS_ACCOUNTING_BACKEND: memory
      NEWS_WORKER_ENABLED: '0'
      RESULTS_WRITE_ENABLED: 'false'
      RESULTS_COLLECTION_ENABLED: 'false'
      RESULTS_SCHEDULER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -q -r requirements.txt
      - name: Apply only verified source spelling and early roundup rejection
        run: |
          python audit/apply_news_imt_repair_20261004.py
          git diff --check
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed<={'bot/news_fact_guard.py','bot/news_policy.py','bot/news_source_holds.py'},changed
          print('NEWS_ONLY_SCOPE_PASS',sorted(changed))
          PY
      - name: Full retained News regression suite
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings tests/test_news*.py tests/test_editorial*.py tests/test_rewrite*.py tests/test_public*.py tests/test_taxonomy*.py --tb=short | tee news-imt-tests.txt
      - name: Save tested integration on audit branch only
        run: |
          test "$GITHUB_REF_NAME" = 'audit/news-football-completion-20261004'
          git config user.name 'NinkoSports News maintenance'
          git config user.email '79318740+macamala@users.noreply.github.com'
          git add bot/news_fact_guard.py bot/news_policy.py bot/news_source_holds.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix(news): recognize literal IMT source spelling and preserve gated retry'
            git push origin HEAD:refs/heads/audit/news-football-completion-20261004
          fi
          git rev-parse HEAD | tee tested-news-commit.txt
          git diff fb3d17b3f8642767f5ebff92bb93a81cbf876acb HEAD --stat
          git archive --format=zip --output=tested-news-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-imt-photo-release-evidence
          path: |
            news-imt-tests.txt
            tested-news-commit.txt
            tested-news-source.zip
          retention-days: 7
