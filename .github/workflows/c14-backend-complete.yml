name: C14 complete preserved backend gate
on:
  push:
    branches: [fix/football-live-player-c14-20260925]
    paths: ['.github/workflows/c14-backend-complete.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          mkdir -p evidence
          git diff 43bf5a54d280ee7bb2b07f75bd8fe7ba7c62f7c9 -- app.py collector tests > evidence/source.patch
          echo 'addac8a3a40902018bc2e6d7f388d0187ef5f8ec6b011c569cbb671a7d52a094  evidence/source.patch' | sha256sum -c
          python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q $(cat audit/football_test_selection.txt) tests/test_hidden_football_aliases.py tests/test_fotmob_match_centre.py tests/test_entity_profile_navigation.py tests/test_c14_live_player.py tests/test_canonical_detail.py tests/test_fiba_rich_detail.py tests/test_sofa_rich_detail.py --junitxml=evidence/tests.xml
      - run: |
          git rev-parse HEAD > evidence/candidate.txt
          git diff --name-only 43bf5a54d280ee7bb2b07f75bd8fe7ba7c62f7c9 -- app.py collector tests | xargs sha256sum > evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c14-backend-complete
          path: evidence
          retention-days: 30
