name: C15 forward final public acceptance
on:
  push:
    branches: [audit/football-recovery-20260925-10]
    paths: ['.github/workflows/c15-forward-final-acceptance.yml', 'audit/checkpoint15_expanded_tables_acceptance.py']
permissions:
  contents: read
jobs:
  live-table-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Keep the exact previously failed unique header selector and add clock observations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('audit/checkpoint15_public_acceptance.py');s=p.read_text()
          old="'hero':page.locator('.mc-hero').inner_text()"
          assert s.count(old)==1
          s=s.replace(old,old+",'timer':page.locator('[role=timer]').all_text_contents()")
          compile(s,str(p),'exec');p.write_text(s)
          out=Path('/tmp/c15-final');out.mkdir(exist_ok=True);(out/'executed_acceptance.py').write_text(s)
          PY
      - run: python audit/checkpoint15_public_acceptance.py
      - run: python audit/checkpoint15_expanded_tables_acceptance.py
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c15-forward-live-tables
          path: |
            /tmp/c15-final
            /tmp/c15-expanded-tables
          retention-days: 30
  preserve-player-home-match:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: macamala/allball-frontend
          ref: 35906e1bde4f5bdba3eb79d6c4c9854093339cd9
          path: frontend
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: python audit/checkpoint13_match_acceptance.py
      - run: python audit/checkpoint14_public_acceptance.py
        if: always()
      - run: python frontend/audit/c14_profile_browser.py
        if: always()
        env:
          TARGET_SITE: https://ninkosports.com
          PROFILE_OUT: /tmp/c15-retained-profiles
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c15-retained-match-player-home
          path: |
            /tmp/c13-public
            /tmp/c14-public
            /tmp/c15-retained-profiles
          retention-days: 30
