name: News system evidence 20261003
on:
  push:
    branches: [audit/news-system-20261003]
    paths: [.github/workflows/news-system-evidence-20261003.yml]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f22e5b603317a12839e123e62b487dbee740fbd5
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact source and offline test dependencies
        run: |
          mkdir -p evidence/wheels
          git archive --format=tar HEAD > evidence/backend.tar
          pip wheel -q -r requirements.txt -w evidence/wheels
      - name: Read every public News menu and recent full article payloads
        run: |
          python - <<'PY'
          import json,pathlib,urllib.request,urllib.parse
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime,timezone
          root=pathlib.Path('evidence');base='https://allball-backend-production.up.railway.app'
          def get(path):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+path,headers={'User-Agent':'NinkoSports-News-Audit/1.0'}),timeout=20) as r:return json.loads(r.read(6000000))
              except Exception as e:return {'read_error':type(e).__name__}
          catalog=json.loads(pathlib.Path('bot/news_football_leagues.json').read_text())
          def menu(row):return row['league'],get('/articles?'+urllib.parse.urlencode({'sport':'football','league':row['league'],'limit':5}))
          with ThreadPoolExecutor(max_workers=3) as pool:menus=dict(pool.map(menu,catalog))
          (root/'menus.json').write_text(json.dumps(menus,ensure_ascii=False))
          recent=get('/articles?sport=football&limit=100');(root/'recent.json').write_text(json.dumps(recent,ensure_ascii=False))
          articles=[a for a in recent if isinstance(a,dict) and a.get('slug')] if isinstance(recent,list) else []
          with ThreadPoolExecutor(max_workers=3) as pool:details=dict(pool.map(lambda a:(a['slug'],get('/articles/'+urllib.parse.quote(a['slug']))),articles[:60]))
          (root/'details.json').write_text(json.dumps(details,ensure_ascii=False))
          summary={'checked_at':datetime.now(timezone.utc).isoformat(),'menus':len(menus),'nonempty':sum(isinstance(v,list) and bool(v) for v in menus.values()),'empty':[k for k,v in menus.items() if v==[]],'errors':{k:v for k,v in menus.items() if not isinstance(v,list)},'AI_requests':0,'production_writes':0}
          (root/'summary.json').write_text(json.dumps(summary,indent=2));print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-system-evidence-20261003
          path: evidence/
          retention-days: 7
