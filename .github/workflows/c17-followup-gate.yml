name: C17 production followup backend gate
on:
  push:
    branches: [fix/football-c17-production-followup]
    paths: ['.github/workflows/c17-followup-gate.yml']
permissions:
  contents: write
  actions: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 0934f992496756deb6c1db5651fc810a0375e4db
          path: saved-handoff
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore exact checksum-pinned reviewed patch
        run: |
          mkdir evidence
          python - <<'PY'
          import base64,gzip,hashlib,subprocess
          from pathlib import Path
          text=Path('saved-handoff/audit/c17-followup-backend.b64').read_text().strip()
          # Six transcription-only errors in the encoded transport. The source
          # must match the independently computed local patch hash before use.
          for old,new in [('NdVVtt','NdVtt'),('VOovUUq','VOovUq'),('NR8xIxZZFlb','NR8xIxZFlb'),('FsyYYzvi','FsyYzvi'),('Fc7U7xv','Fc7Udxv'),('WerKyKyZO','WerKyZO')]:
            assert text.count(old)==1,(old,text.count(old))
            text=text.replace(old,new)
          data=gzip.decompress(base64.b64decode(text,validate=True))
          assert hashlib.sha256(data).hexdigest()=='14e7da128cee02eca5fba103701820c12bff74481269799c47192edc103c53f6'
          Path('evidence/source.patch').write_bytes(data)
          Path('evidence/corrected-backend.b64').write_text(text)
          subprocess.run(['git','apply','--check','evidence/source.patch'],check=True)
          subprocess.run(['git','apply','evidence/source.patch'],check=True)
          PY
          git diff --check
          python -m pip install -r requirements.txt
      - name: All retained and new production regression tests
        run: python -m pytest -q $(cat audit/football_test_selection.txt) tests/test_hidden_football_aliases.py tests/test_fotmob_match_centre.py tests/test_entity_profile_navigation.py tests/test_c14_live_player.py tests/test_canonical_detail.py tests/test_fiba_rich_detail.py tests/test_sofa_rich_detail.py tests/test_c15_live_tables.py tests/test_c15_parent_league_tables.py tests/test_worker_shutdown_handoff.py tests/test_c16_competition_hub.py tests/test_c16_identity_lookup.py tests/test_c17_categories_scorers.py tests/test_c17_review_regressions.py tests/test_c17_production_followup.py --junitxml=evidence/tests.xml
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 36205878806
          artifact-ids: 10892589996
          merge-multiple: true
          path: /tmp/source
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 36206124825
          artifact-ids: 10892924813
          merge-multiple: true
          path: /tmp/native
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 36207063952
          artifact-ids: 10894560682
          merge-multiple: true
          path: /tmp/scorers
      - name: Retained real native category and scorer replay
        run: PYTHONPATH=. python audit/c17_native_replay.py /tmp/source /tmp/native /tmp/scorers evidence
      - name: Publish tested isolated candidate only
        run: |
          git config user.name 'NinkoSports regression checks'
          git config user.email '79318740+macamala@users.noreply.github.com'
          git add app.py collector tests/test_c17_production_followup.py
          git commit -m 'Connect legacy women competition rows and verify scorer-owned player profiles across provider categories'
          git push origin HEAD:refs/heads/fix/football-c17-production-followup
          git rev-parse HEAD > evidence/candidate.txt
          git diff --name-only 255f798cdbd8f33139d160aed60c37ef831ce4cf HEAD | xargs sha256sum > evidence/SHA256SUMS
          git diff 255f798cdbd8f33139d160aed60c37ef831ce4cf HEAD -- app.py collector tests > evidence/final-source.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c17-followup-backend-gated
          path: evidence
          retention-days: 30
