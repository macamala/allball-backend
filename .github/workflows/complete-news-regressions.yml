name: Complete News regressions

on:
  pull_request:
    paths:
      - "bot/**"
      - "sports_registry/news_aliases.py"
      - "news_runtime.py"
      - "deploy/news/**"
      - "tests/test_*news*.py"
      - ".github/workflows/complete-news-regressions.yml"

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Run complete retained News regressions
        run: python -m pytest -q tests/test_*news*.py
