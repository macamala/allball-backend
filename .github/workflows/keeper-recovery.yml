name: Hidden canonical keeper regression gate
on:
  push:
    branches: [fix/football-hidden-keeper-20260925]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite:////tmp/keeper-tests.db
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python audit/apply_keeper.py
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q collector tests
      - name: Run results, source, keeper, group and identity regressions
        run: >-
          python -m pytest -q
          tests/test_results_recovery.py tests/test_incremental_scheduler.py
          tests/test_collector_architecture.py tests/test_fotmob.py
          tests/test_fotmob_nations_league.py tests/test_fotmob_breadth.py
          tests/test_fotmob_asset_backfill.py tests/test_live_watch.py
          tests/test_stale_live.py tests/test_score_integrity.py
          tests/test_public_score_assets.py tests/test_live_integration.py
          tests/test_rich_detail.py tests/test_football_recovery_completion.py
          tests/test_standings_closure.py tests/test_dynamic_sofa_standings.py
          tests/test_dedupe.py tests/test_canonical_identity.py
          tests/test_nhl_public_dedupe.py tests/test_public_source_policy.py
          tests/test_keeper_revalidation.py
          --disable-warnings --junitxml=/tmp/keeper-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keeper-regression-evidence
          path: /tmp/keeper-tests.xml
          retention-days: 7
  publish-tested-branch:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: |
          python3 audit/apply_keeper.py
          git add collector/collect.py
          git config user.name 'NinkoSports recovery checks'
          git config user.email '79318740+macamala@users.noreply.github.com'
          git commit -m 'Restore hidden canonical football only with current exact source proof (196 regressions verified)'
          git push origin HEAD:fix/football-hidden-keeper-20260925
          echo "TESTED_SOURCE_COMMIT=$(git rev-parse HEAD)"
