name: Football recovery exact source
on:
  push:
    branches: [audit/football-recovery-20260925-10]
    paths: ['.github/workflows/football-recovery-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2f5108c7d5394bc4c87743a885f39e9472e7ebe2
          persist-credentials: false
          path: backend
      - uses: actions/checkout@v4
        with:
          repository: macamala/allball-frontend
          ref: 9a18f3ec91610356304fc614b9a10b621792291f
          persist-credentials: false
          path: frontend
      - run: |
          mkdir -p /tmp/exact-source
          git -C backend archive --format=tar.gz HEAD > /tmp/exact-source/backend.tar.gz
          git -C frontend archive --format=tar.gz HEAD > /tmp/exact-source/frontend.tar.gz
          git -C backend rev-parse HEAD > /tmp/exact-source/backend-sha.txt
          git -C frontend rev-parse HEAD > /tmp/exact-source/frontend-sha.txt
          cd /tmp/exact-source && sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: football-recovery-exact-source
          path: /tmp/exact-source
          retention-days: 30
