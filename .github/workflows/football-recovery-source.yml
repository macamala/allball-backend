name: Football recovery exact source
on:
  push:
    branches: [audit/football-recovery-20260925-10]
    paths: ['.github/workflows/football-recovery-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c2f5b5d610718cc43b6205296444387ea3b6df7c
          persist-credentials: false
          path: backend
      - uses: actions/checkout@v4
        with:
          repository: macamala/allball-frontend
          ref: d0db12fe066fba328e86e9e8a80b313c20d3d2df
          persist-credentials: false
          path: frontend
      - run: |
          mkdir -p /tmp/exact-source
          git -C backend archive --format=tar.gz HEAD > /tmp/exact-source/backend-c2f5b5d.tar.gz
          git -C frontend archive --format=tar.gz HEAD > /tmp/exact-source/frontend-d0db12f.tar.gz
          git -C backend rev-parse HEAD > /tmp/exact-source/backend-sha.txt
          git -C frontend rev-parse HEAD > /tmp/exact-source/frontend-sha.txt
          cd /tmp/exact-source && sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: football-recovery-exact-source
          path: /tmp/exact-source
          retention-days: 30
