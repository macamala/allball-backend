name: C14 deployed public acceptance
on:
  push:
    branches: [audit/football-recovery-20260925-10]
    paths: ['.github/workflows/c14-public-acceptance.yml', 'audit/checkpoint14_public_acceptance.py']
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: python audit/checkpoint14_public_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c14-public-acceptance
          path: /tmp/c14-public
          retention-days: 30
  source-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: |
          mkdir -p /tmp/c14-source-timing
          python - <<'PY'
          import json,time,urllib.request,concurrent.futures
          from pathlib import Path
          from datetime import datetime,timezone
          out=Path('/tmp/c14-source-timing');api='https://allball-backend-production.up.railway.app';summary=[]
          def get(name,url):
            start=time.monotonic()
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Accept':'application/json'}),timeout=20) as r:d={'http':r.status,'payload':json.load(r)}
            except Exception as e:d={'error':str(e)}
            d.update(url=url,at=datetime.now(timezone.utc).isoformat(),seconds=time.monotonic()-start);(out/(name+'.json')).write_text(json.dumps(d,ensure_ascii=False,indent=2));return d
          for n in range(4):
            if n:time.sleep(25)
            day=datetime.now(timezone.utc).strftime('%Y%m%d')
            with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              a=pool.submit(get,'source-'+str(n),'https://www.fotmob.com/api/data/matches?date='+day)
              b=pool.submit(get,'public-'+str(n),api+'/sports-data/events?sport=football&date_from=2026-09-24T14%3A00%3A00Z&date_to=2026-09-26T13%3A59%3A59Z')
              source,public=a.result(),b.result()
            native=[m for l in source.get('payload',{}).get('leagues',[]) for m in l.get('matches',[]) if (m.get('status') or {}).get('started') and not (m.get('status') or {}).get('finished')]
            active=[e for e in public.get('payload',{}).get('events',[]) if e.get('status') in ('live','break','halftime')]
            details=[]
            for e in active[:3]:details.append(get('score-'+str(n)+'-'+e['id'],api+'/sports-data/matches/'+e['id']+'/score'))
            summary.append({'at':public['at'],'source_live':native,'public_live':active,'detail_count':len(details),'source_http':source.get('http'),'public_http':public.get('http')})
          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2));print([(r['at'],len(r['source_live']),len(r['public_live'])) for r in summary])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c14-source-timing
          path: /tmp/c14-source-timing
          retention-days: 30
