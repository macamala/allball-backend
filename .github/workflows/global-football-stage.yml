name: Global football isolated release gate
on:
  push:
    branches: [fix/football-global-refresh-20260925]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: sqlite:////tmp/global-football-tests.db
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: all-football-baseline
          run-id: 36078082816
          github-token: ${{ github.token }}
          path: /tmp/source-baseline
      - name: Restore exact reviewed source and real multi-league fixture
        run: |
          python audit/apply_global_football.py
          python audit/build_global_football_fixture.py /tmp/source-baseline
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q collector tests
      - name: All-football, source, identity, scheduler and existing regressions
        run: python -m pytest -q $(cat audit/football_test_selection.txt) --disable-warnings --junitxml=/tmp/global-football-tests.xml
      - name: Preserve exact tested source and hashes
        if: always()
        run: |
          mkdir -p /tmp/global-football-evidence
          cp /tmp/global-football-tests.xml /tmp/global-football-evidence/ || true
          git add -N collector tests
          git diff --binary -- collector tests > /tmp/global-football-evidence/tested-source.patch
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          files=subprocess.check_output(['git','diff','--name-only','--','collector','tests']).decode().splitlines()
          out={name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in files}
          Path('/tmp/global-football-evidence/source-sha256.json').write_text(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-football-regression-evidence
          path: /tmp/global-football-evidence
          retention-days: 30
  publish-tested-branch:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: all-football-baseline
          run-id: 36078082816
          github-token: ${{ github.token }}
          path: /tmp/source-baseline
      - run: |
          python3 audit/apply_global_football.py
          python3 audit/build_global_football_fixture.py /tmp/source-baseline
          git add collector tests
          git config user.name 'NinkoSports regression checks'
          git config user.email '79318740+macamala@users.noreply.github.com'
          git commit -m 'Refresh all football with bounded source cache, strong league context and resumable dated ingestion'
          git push origin HEAD:fix/football-global-refresh-20260925
          echo "TESTED_SOURCE_COMMIT=$(git rev-parse HEAD)"
