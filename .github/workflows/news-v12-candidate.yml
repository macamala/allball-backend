name: News v12 candidate gate

on:
  push:
    branches:
      - fix/news-v12-taxonomy-20260927
    paths:
      - bot/news_translations.py
      - sports_registry/news_aliases.py
      - tests/test_news_translations.py
      - tests/test_classify.py
      - .github/workflows/news-v12-candidate.yml

permissions:
  contents: read

concurrency:
  group: news-v12-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Diff and syntax checks
        run: |
          git diff --check HEAD~5 HEAD
          python -m compileall -q bot sports_registry
      - name: Focused News and taxonomy regression
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_news_translations.py \
            tests/test_classify.py \
            tests/test_news03_policy.py \
            tests/test_news03_http.py \
            tests/test_news03_integration.py \
            tests/test_taxonomy_resolver.py \
            tests/test_taxonomy_leakage.py \
            tests/test_news_deploy_contract.py
