name: Screenshot score regressions read-only
on:
  push:
    branches: [audit/football-recovery-20260925-10]
    paths: ['.github/workflows/screenshot-regressions.yml']
permissions:
  contents: read
jobs:
  public-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c2f5b5d610718cc43b6205296444387ea3b6df7c
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          mkdir -p /tmp/screenshot-evidence
          python - <<'PY'
          import urllib.request,json,concurrent.futures
          from urllib.parse import urlencode
          from pathlib import Path
          from datetime import datetime,timezone,timedelta
          base='https://allball-backend-production.up.railway.app';out=Path('/tmp/screenshot-evidence')
          urls={'havelse-detail':base+'/sports-data/matches/ninko-evt-d0203f3635ffe7d1db45','live':base+'/sports-data/live'}
          for day,lo,hi in [('fri25','2026-09-24T14:00:00Z','2026-09-25T13:59:59Z'),('sat26','2026-09-25T14:00:00Z','2026-09-26T13:59:59Z')]:
            for sport in ('football','all'):
              params={'unlimited':1,'date_from':lo,'date_to':hi}
              if sport=='football':params['sport']=sport
              urls[day+'-'+sport]=base+'/sports-data/events?'+urlencode(params)
          urls['delta']=base+'/sports-data/status?'+urlencode({'since':(datetime.now(timezone.utc)-timedelta(minutes=30)).isoformat()})
          urls['fotmob24']='https://www.fotmob.com/api/data/matches?date=20260924'
          urls['fotmob25']='https://www.fotmob.com/api/data/matches?date=20260925'
          from collector.verified_coverage import OPENLIGADB_LEAGUES
          spec=next(x for x in OPENLIGADB_LEAGUES if x['competition_id']=='germany-3-liga')
          urls['openliga']='https://api.openligadb.de/getmatchdata/'+spec['shortcut']
          def get(pair):
            name,url=pair
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Accept':'application/json'}),timeout=25) as r:data={'url':url,'http':r.status,'fetched_at':datetime.now(timezone.utc).isoformat(),'payload':json.load(r)}
            except Exception as e:data={'url':url,'error':str(e)}
            (out/(name+'.json')).write_text(json.dumps(data,ensure_ascii=False,indent=2));return name,data
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool: results=dict(pool.map(get,urls.items()))
          ids=set()
          for name,d in results.items():
            p=d.get('payload') or {}; rows=p.get('events',[]) if isinstance(p,dict) else []
            chosen=[r for r in rows if any(x in str(r.get('home')) for x in ('Andorra','Havelse','Kosovo'))]
            ids.update(r['id'] for r in chosen)
            print(name,'HTTP',d.get('http'),'rows',len(rows),'targets',json.dumps(chosen,ensure_ascii=False))
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:list(pool.map(get,[('detail-'+eid,base+'/sports-data/matches/'+eid) for eid in sorted(ids)[:12]]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-score-evidence
          path: /tmp/screenshot-evidence
          retention-days: 30
