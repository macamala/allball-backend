name: Football public QA
on:
  push:
    branches: [audit/football-qa-20260925]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare independent desktop and mobile browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check scores, full-board consistency and group tables on production
        run: python audit/football_release_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-release-evidence
          path: /tmp/football-release-check
          if-no-files-found: error
          retention-days: 7
