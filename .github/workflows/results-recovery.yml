name: Results recovery checks
on:
  push:
    branches: [fix/live-score-recovery-20260925]
permissions:
  contents: read
concurrency:
  group: results-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite:////tmp/ninkosports-completion-tests.db
      RESULTS_COLLECTION_ENABLED: 'true'
      RESULTS_WRITE_ENABLED: 'true'
      RESULTS_SCHEDULER_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply checksum-bound completion patch
        run: python audit/apply_phase2.py
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q collector tests
      - name: Run 176 football, source, identity and standings regressions
        run: >-
          python -m pytest -q
          tests/test_results_recovery.py tests/test_incremental_scheduler.py
          tests/test_collector_architecture.py tests/test_fotmob.py
          tests/test_fotmob_nations_league.py tests/test_fotmob_breadth.py
          tests/test_fotmob_asset_backfill.py tests/test_live_watch.py
          tests/test_stale_live.py tests/test_score_integrity.py
          tests/test_public_score_assets.py tests/test_live_integration.py
          tests/test_rich_detail.py tests/test_football_recovery_completion.py
          tests/test_standings_closure.py tests/test_dynamic_sofa_standings.py
          tests/test_dedupe.py tests/test_canonical_identity.py
          tests/test_nhl_public_dedupe.py tests/test_public_source_policy.py
          --disable-warnings --junitxml=/tmp/football-completion-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-completion-verified
          path: |
            /tmp/football-completion.patch
            /tmp/football-completion-tests.xml
          retention-days: 7
  publish-tested-branch:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Publish tested source only to recovery branch
        run: |
          python3 audit/apply_phase2.py
          git add collector/adapters_fotmob.py collector/canonical_standings.py collector/collect.py collector/fotmob_tables.py collector/limits.py collector/match.py collector/participant_alias.py collector/provider.py collector/sources.py collector/standings_enrich.py tests/fixtures/fotmob_nations_tables_20260924.json tests/test_football_recovery_completion.py
          git rm -r audit/phase2
          git config user.name 'NinkoSports recovery checks'
          git config user.email '79318740+macamala@users.noreply.github.com'
          git commit -m 'Preserve canonical score updates and complete group-scoped Nations League standings (176 regressions verified)'
          git push origin HEAD:fix/live-score-recovery-20260925
          echo "TESTED_SOURCE_COMMIT=$(git rev-parse HEAD)"
