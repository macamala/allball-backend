name: Results recovery checks
on:
  push:
    branches: [fix/live-score-recovery-20260925]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: results-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      patch_present: ${{ steps.patch.outputs.present }}
    env:
      DATABASE_URL: sqlite:////tmp/ninkosports-recovery-tests.db
      RESULTS_COLLECTION_ENABLED: 'true'
      RESULTS_WRITE_ENABLED: 'true'
      RESULTS_SCHEDULER_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply checksum-verified recovery patch in isolated checkout
        id: patch
        run: |
          if test -f audit/recovery/00.b64; then
            python audit/apply_recovery.py
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install existing pinned project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all collector and test code
        run: python -m compileall -q collector tests
      - name: Run results, identity, live-watch and detail regressions
        run: >-
          python -m pytest -q
          tests/test_results_recovery.py tests/test_incremental_scheduler.py
          tests/test_collector_architecture.py tests/test_fotmob.py
          tests/test_fotmob_nations_league.py tests/test_fotmob_breadth.py
          tests/test_fotmob_asset_backfill.py tests/test_live_watch.py
          tests/test_stale_live.py tests/test_score_integrity.py
          tests/test_public_score_assets.py tests/test_live_integration.py
          tests/test_rich_detail.py
          --disable-warnings --junitxml=/tmp/results-recovery-tests.xml
      - name: Audit real public responses (read-only)
        run: python audit/recovery_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-results-recovery
          path: |
            /tmp/results-recovery-tests.xml
            /tmp/ninkosports-verified-recovery.patch
            /tmp/score-public-audit
          if-no-files-found: ignore
          retention-days: 7
  publish-recovery-branch:
    needs: verify
    if: needs.verify.outputs.patch_present == 'true' && github.ref == 'refs/heads/fix/live-score-recovery-20260925'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Publish only tested source to the recovery branch, never main
        run: |
          python3 audit/apply_recovery.py
          git add collector/adapters_fotmob.py collector/enrichment.py collector/fotmob_asset_backfill.py collector/fotmob_crosswalk.py collector/incremental.py collector/list_extra.py collector/merge.py collector/normalize.py collector/priority_cycle.py collector/provider.py collector/urgency.py collector/worker.py tests/fixtures/fotmob_nations_groups_20260924.json tests/test_fotmob_asset_backfill.py tests/test_incremental_scheduler.py tests/test_results_recovery.py tests/test_rich_detail.py
          git rm -r audit/recovery
          git config user.name 'NinkoSports recovery checks'
          git config user.email '79318740+macamala@users.noreply.github.com'
          git commit -m 'Repair live scheduling, group identity and first-fetch artwork (130 regressions verified)'
          git push origin HEAD:fix/live-score-recovery-20260925
          echo "TESTED_SOURCE_COMMIT=$(git rev-parse HEAD)"
