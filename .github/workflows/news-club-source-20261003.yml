name: News club source snapshot 20261003
on:
  push:
    branches: [audit/news-club-coverage-20261003]
    paths: [.github/workflows/news-club-source-20261003.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2e1a2d8bf72879953403ec9ff989a17839ba8764
          persist-credentials: false
      - run: mkdir -p source-export && git archive --format=tar HEAD > source-export/backend.tar
      - uses: actions/upload-artifact@v4
        with:
          name: news-club-source-20261003
          path: source-export/
          retention-days: 7
