name: Checkpoint11 explicit PostgreSQL driver gate
on:
  push:
    branches: [fix/postgres-driver-c11-20260925]
    paths: ['audit/apply_postgres_driver_c11.py', '.github/workflows/postgres-driver-c11.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python audit/apply_postgres_driver_c11.py
      - run: python -m pip install -r requirements.txt
      - run: |
          mkdir -p /tmp/c11-driver
          python -m pip freeze > /tmp/c11-driver/dependencies.txt
          python -m pytest -q $(cat audit/football_test_selection.txt) --disable-warnings --junitxml=/tmp/c11-driver/tests.xml
      - if: always()
        run: |
          mkdir -p /tmp/c11-driver
          git add -N tests database.py audit/football_test_selection.txt
          git diff --binary > /tmp/c11-driver/source.patch
          sha256sum /tmp/c11-driver/source.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint11-driver-gate
          path: /tmp/c11-driver
          retention-days: 30
  publish-tested-source:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - run: |
          python audit/apply_postgres_driver_c11.py
          git add database.py tests/test_database_driver_startup.py audit/football_test_selection.txt
          git config user.name 'NinkoSports regression checks'
          git config user.email '79318740+macamala@users.noreply.github.com'
          git commit -m 'Select the installed psycopg2 driver explicitly across SQLAlchemy versions'
          git push origin HEAD:fix/postgres-driver-c11-20260925
          echo "TESTED_SOURCE_COMMIT=$(git rev-parse HEAD)"
