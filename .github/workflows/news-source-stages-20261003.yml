name: News source stage matrix 20261003
on:
  push:
    branches: [audit/news-system-20261003]
    paths: [.github/workflows/news-source-stages-20261003.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      NINKO_SKIP_STARTUP_INDEX: '1'
      NINKO_SKIP_INTEGRITY_BACKFILL: '1'
      NEWS_FOOTBALL_ONLY: '1'
      NEWS_EXPANDED_FEEDS_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f22e5b603317a12839e123e62b487dbee740fbd5
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - name: Verify existing source stages without credentials writers or production writes
        run: |
          mkdir -p stage-evidence
          python - <<'PY'
          import json,pathlib,logging
          from concurrent.futures import ThreadPoolExecutor
          from collections import defaultdict,Counter
          from urllib.parse import urlsplit
          from bot.feeds import enabled_feeds
          from bot.news_official_indexes import HTML_INDEXES,SITEMAP_SOURCES,_hydrate_source
          from bot.fetch_sources import _fetch_feed_entries,_classify_candidate,_classify_item,_pick_reachable_article_image
          from bot.extract import extract_from_url,extract_image_candidates_from_url
          from bot.news_football_priority import candidate_football_section
          from bot.news_football_memberships import refresh_football_news_memberships
          from bot.news_policy import non_article_news_reason
          from bot.quality import quality_check
          from datetime import datetime,timezone
          logging.basicConfig(level=logging.WARNING)
          root=pathlib.Path('stage-evidence');refresh_football_news_memberships()
          jobs=[('rss',cfg) for cfg in enabled_feeds() if cfg.get('sport') in {None,'football'}]
          jobs += [('html',cfg) for cfg in (*HTML_INDEXES,*SITEMAP_SOURCES) if cfg.get('enabled',True) and cfg.get('sport')=='football']
          def probe(pair):
              kind,cfg=pair;publisher=cfg.get('publisher',cfg.get('id','unknown'));out={'kind':kind,'publisher':publisher,'url':cfg['url'],'items':[]}
              try:
                  entries=_fetch_feed_entries(cfg,4) if kind=='rss' else _hydrate_source(cfg,2)
                  for item in entries:
                      row={'title':item['title'],'url':item['url'],'published_at':str(item.get('published_at'))}
                      try:
                          tags=_classify_candidate(item);row['sport_before']=tags.sport;row['menu_before']=candidate_football_section(item,tags)
                          reason=non_article_news_reason(item);row['product_hold']=reason
                          if reason or tags.sport not in {None,'football'}:out['items'].append(row);continue
                          body=item.get('_extracted');image=item.get('_extracted_image')
                          if not body:body,image=extract_from_url(item['url'])
                          tags=_classify_item(item,body or '')
                          enriched={**item,'_classification_text':body or ''}
                          photos=list(item.get('image_candidates') or [])
                          if image:photos.append({'url':image,'source':'og','in_article':False})
                          if not photos:photos=extract_image_candidates_from_url(item['url'])
                          hero=_pick_reachable_article_image(photos,max_checks=2)
                          ok,reason=quality_check(item['title'],body or '',tags.sport,require_english=False)
                          product=non_article_news_reason({**item,'body':body or ''})
                          row.update(sport=tags.sport,menu=candidate_football_section(enriched,tags),body_words=len((body or '').split()),quality_reason=reason,product_hold=product,hero=hero,eligible_before_writer=bool(ok and hero and not product and tags.sport=='football'),body=(body or '')[:7000])
                      except Exception as exc:row['error']=type(exc).__name__+': '+str(exc)[:120]
                      out['items'].append(row)
              except Exception as exc:out['error']=type(exc).__name__+': '+str(exc)[:120]
              slug=cfg.get('id') or publisher.lower().replace(' ','-').replace('/','-')
              (root/(kind+'-'+slug+'.json')).write_text(json.dumps(out,ensure_ascii=False,indent=2));print(publisher,kind,len(out['items']),out.get('error'),flush=True)
              return out
          grouped=defaultdict(list)
          for job in jobs:grouped[urlsplit(job[1]['url']).hostname].append(job)
          with ThreadPoolExecutor(max_workers=4) as pool:rows=[r for batch in pool.map(lambda items:[probe(item) for item in items],grouped.values()) for r in batch]
          ready=Counter(item.get('menu') or 'unknown' for row in rows for item in row['items'] if item.get('eligible_before_writer'))
          summary={'checked_at':datetime.now(timezone.utc).isoformat(),'sources':len(rows),'ready_by_menu':dict(ready),'errors':[{'publisher':r['publisher'],'url':r['url'],'error':r['error']} for r in rows if r.get('error')],'AI_requests':0,'production_writes':0}
          (root/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2));print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-source-stages-20261003
          path: stage-evidence/
          retention-days: 7
