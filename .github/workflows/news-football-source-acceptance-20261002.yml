name: Football News source acceptance 20261002
on:
  push:
    branches: [audit/news-football-20261002]
    paths: [.github/workflows/news-football-source-acceptance-20261002.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      NINKO_SKIP_STARTUP_INDEX: '1'
      NINKO_SKIP_INTEGRITY_BACKFILL: '1'
      NEWS_FOOTBALL_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 753b0ad8a89a4a4bef6aab90aa50439085fe3311
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -q -r requirements.txt
      - name: Fresh-source admission diagnostics without writers or publication
        run: |
          mkdir -p source-evidence
          python - <<'PY'
          import json,pathlib,logging
          from concurrent.futures import ThreadPoolExecutor
          from collections import defaultdict
          from datetime import datetime,timezone
          from types import SimpleNamespace
          from bot.news_football_sources import RSS_FEEDS,HTML_INDEXES
          from bot.news_official_indexes import _hydrate_source
          from bot.fetch_sources import _fetch_feed_entries,_classify_candidate,_pick_reachable_article_image
          from bot.news_policy import non_article_news_reason
          from bot.quality import quality_check
          from bot.news_football_sections import football_news_section
          from bot.news_football_memberships import refresh_football_news_memberships
          logging.basicConfig(level=logging.INFO)
          root=pathlib.Path('source-evidence');catalog=refresh_football_news_memberships()
          def probe(pair):
              kind,cfg=pair;sid=cfg.get('id') or cfg.get('publisher');out={'source':sid,'kind':kind,'url':cfg['url'],'items':[],'checked_at':datetime.now(timezone.utc).isoformat()}
              try:
                  entries=_fetch_feed_entries(cfg,3) if kind=='rss' else _hydrate_source(cfg,3)
                  for item in entries:
                      facts=item.get('_extracted') or item.get('summary','');tags=_classify_candidate(item)
                      photos=list(item.get('image_candidates') or [])
                      if item.get('image'):photos.append({'url':item['image'],'source':'rss','in_article':False})
                      hero=_pick_reachable_article_image(photos,max_checks=3)
                      ok,reason=quality_check(item['title'],facts,tags.sport,require_english=False)
                      product=non_article_news_reason({**item,'body':facts})
                      article=SimpleNamespace(title=item['title'],summary=item.get('summary','')[:500],content=facts,source_url=item['url'],published_at=item['published_at'])
                      section=football_news_section(article) if tags.sport=='football' else None
                      out['items'].append({'title':item['title'],'url':item['url'],'published_at':str(item['published_at']),'words':len(facts.split()),'sport':tags.sport,'section_before_english_writing':section,'image_verified':bool(hero),'hero':hero,'quality_ok':ok,'quality_reason':reason,'non_article_reason':product,'body_origin':item.get('_source_body_origin','verified-article-page'),'eligible_before_writer':bool(ok and not product and hero and tags.sport=='football')})
              except Exception as exc:out['error']=type(exc).__name__+': '+str(exc)[:180]
              (root/(sid.replace(' ','-')+'.json')).write_text(json.dumps(out,ensure_ascii=False,indent=2));print(json.dumps(out,ensure_ascii=False));return out
          pairs=[('rss',cfg) for cfg in RSS_FEEDS]+[('html',cfg) for cfg in HTML_INDEXES]
          hosts=defaultdict(list)
          from urllib.parse import urlsplit
          for pair in pairs:hosts[urlsplit(pair[1]['url']).hostname].append(pair)
          with ThreadPoolExecutor(max_workers=3) as pool:results=[r for batch in pool.map(lambda pairs:[probe(p) for p in pairs],hosts.values()) for r in batch]
          summary={'memberships':catalog,'sources':len(results),'sources_with_fresh_items':sum(bool(r['items']) for r in results),'fresh_candidates':sum(len(r['items']) for r in results),'eligible_before_writer':sum(i['eligible_before_writer'] for r in results for i in r['items']),'AI_requests':0,'published':0,'note':'Discovery and image validation are not evidence of published News coverage.'}
          (root/'summary.json').write_text(json.dumps(summary,indent=2));print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-news-source-acceptance-20261002
          path: source-evidence/
          retention-days: 7
