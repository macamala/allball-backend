name: Football source and lifecycle regressions
on:
  pull_request:
    branches: [main]
    paths: ['collector/**', 'tests/**', 'app.py', 'requirements.txt', '.github/workflows/football-regressions.yml']
  push:
    branches: [main]
    paths: ['collector/**', 'tests/**', 'app.py', 'requirements.txt', '.github/workflows/football-regressions.yml']
permissions:
  contents: read
jobs:
  football-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: sqlite:////tmp/football-regressions.db
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q collector tests
      - name: Test committed source; fixture and observations are offline
        run: python -m pytest -q $(cat audit/football_test_selection.txt) --disable-warnings --junitxml=/tmp/football-regressions.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-regressions
          path: /tmp/football-regressions.xml
          retention-days: 14
