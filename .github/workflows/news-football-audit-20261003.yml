name: Football News read-only checks 20261003
on:
  push:
    branches: [audit/news-football-20261003]
    paths: [.github/workflows/news-football-audit-20261003.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      NINKO_SKIP_STARTUP_INDEX: '1'
      NINKO_SKIP_INTEGRITY_BACKFILL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -q -r requirements.txt
      - name: Isolated News regression tests
        run: |
          mkdir -p news-audit
          python -m pytest -q tests/test_news* --junitxml=news-audit/tests.xml > news-audit/tests.txt 2>&1 || { tail -80 news-audit/tests.txt; exit 1; }
          tail -3 news-audit/tests.txt
      - name: Public football News counts, no credentials or production writes
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,urllib.request,urllib.parse
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime,timezone
          root=pathlib.Path('news-audit');root.mkdir(exist_ok=True)
          base='https://allball-backend-production.up.railway.app'
          def check(row):
              out={'league':row['league'],'label':row['label']}
              try:
                  url=base+'/articles?'+urllib.parse.urlencode({'sport':'football','league':row['league'],'limit':5})
                  with urllib.request.urlopen(url,timeout=20) as response:articles=json.loads(response.read(4000000))
                  assert isinstance(articles,list)
                  out['articles']=[{k:a.get(k) for k in ['id','slug','title','league','published_at','created_at','image_url','image']} for a in articles]
              except Exception as exc:out['error']=type(exc).__name__
              return out
          catalog=json.loads(pathlib.Path('bot/news_football_leagues.json').read_text())
          with ThreadPoolExecutor(max_workers=3) as pool:rows=list(pool.map(check,catalog))
          summary={'checked_at':datetime.now(timezone.utc).isoformat(),'menus':len(rows),'nonempty':sum(bool(r.get('articles')) for r in rows),'empty':[r['league'] for r in rows if r.get('articles')==[]],'errors':[r for r in rows if r.get('error')]}
          (root/'coverage.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          (root/'summary.json').write_text(json.dumps(summary,indent=2));print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-news-audit-20261003
          path: news-audit/
          retention-days: 7
