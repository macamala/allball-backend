name: Football News production verification 20261003
on:
  push:
    branches: [audit/news-football-20261003]
    paths: [.github/workflows/news-football-production-20261003.yml]
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          repository: macamala/allball-frontend
          ref: 43fbf23e08f46ebfd6a2d1a5b11078ba78999e9f
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact News-menu coverage using the deployed read-only adapter
        run: |
          mkdir -p production-evidence
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {readNewsData,FOOTBALL_NEWS_TOPICS,newsMatchBucket} from './src/lib/newsFootballData.js';
          const catalog=JSON.parse(fs.readFileSync('src/config/newsFootballLeagues.json','utf8'));
          const base='https://allball-backend-production.up.railway.app';
          const rows=[];
          async function get(path,options={}){const r=await fetch(base+path,{...options,signal:options.signal||AbortSignal.timeout(18000)});if(!r.ok)throw Error('HTTP '+r.status);return r.json();}
          async function check(row){const out={league:row.league,label:row.label,checked_at:new Date().toISOString()};
            try{const articles=await get('/articles?'+new URLSearchParams({sport:'football',league:row.league,limit:'8'}));out.articles=articles.map(a=>({id:a.id,slug:a.slug,title:a.title,league:a.league,sport:a.sport,published_at:a.published_at,created_at:a.created_at,image_url:a.image_url||a.image}));out.wrong_league=articles.filter(a=>a.league!==row.league||a.sport!=='football').length;out.fresh=articles.filter(a=>Date.now()-Date.parse(a.published_at)<86400000).length;}catch(e){out.news_error=String(e);}
            if(!FOOTBALL_NEWS_TOPICS.has(row.league)){
              try{const data=await readNewsData(get,row.league,'standings');out.standings={competition:data.competition?.id||data.competition,season:data.season,rows:data.rows?.length||0,stale:data.stale,available:data.available};}catch(e){out.standings_error=String(e);}
              try{const data=await readNewsData(get,row.league,'fixtures');out.matches={competition:data.competition?.id||data.competition,total:data.events?.length||0,fixtures:(data.events||[]).filter(e=>newsMatchBucket(e)==='fixtures').length,results:(data.events||[]).filter(e=>newsMatchBucket(e)==='results').length,other:(data.events||[]).filter(e=>newsMatchBucket(e)==='other').length,stale:data.coverage?.stale,missing_team_logos:(data.events||[]).filter(e=>!e.home?.logo||!e.away?.logo).length};}catch(e){out.matches_error=String(e);}
            }
            rows.push(out);fs.writeFileSync('production-evidence/coverage.json',JSON.stringify(rows,null,2));console.log(out.league,'news',out.articles?.length,'table',out.standings?.rows,'matches',out.matches?.total,out.news_error||out.standings_error||out.matches_error||'');}
          const pending=[...catalog];await Promise.all(Array.from({length:2},async()=>{while(pending.length)await check(pending.shift());}));
          const summary={checked_at:new Date().toISOString(),menus:rows.length,nonempty_menus:rows.filter(r=>r.articles?.length>0).length,menus_with_fresh_articles:rows.filter(r=>r.fresh>0).length,tables_with_rows:rows.filter(r=>r.standings?.rows>0).length,menus_with_matches:rows.filter(r=>r.matches?.total>0).length,menus_with_fixtures:rows.filter(r=>r.matches?.fixtures>0).length,menus_with_results:rows.filter(r=>r.matches?.results>0).length,wrong_league:rows.reduce((s,r)=>s+(r.wrong_league||0),0),empty_menus:rows.filter(r=>r.articles?.length===0).map(r=>r.league),errors:rows.filter(r=>r.news_error||r.standings_error||r.matches_error).map(r=>({league:r.league,news:r.news_error,standings:r.standings_error,matches:r.matches_error})),all_menus_complete:false};
          const german=rows.find(r=>r.league==='germany-bundesliga');summary.known_frauen_mislabel_present=german?.articles?.some(a=>/Frankfurt Frauen/i.test(a.title))||false;
          fs.writeFileSync('production-evidence/summary.json',JSON.stringify(summary,null,2));console.log(JSON.stringify(summary,null,2));
          if(rows.length!==86||summary.wrong_league)throw Error('Menu/sport scope failed');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-news-production-coverage-20261003
          path: production-evidence/
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -q playwright && python -m playwright install --with-deps chromium
      - name: Public desktop and mobile tabs and real article photographs
        run: |
          mkdir -p browser-evidence
          python - <<'PY'
          import json,pathlib
          from playwright.sync_api import sync_playwright
          root=pathlib.Path('browser-evidence');results=[];failures=[]
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for width in [1440,390,320]:
                  page=browser.new_page(viewport={'width':width,'height':900},timezone_id='Australia/Sydney')
                  errors=[];writes=[]
                  page.on('pageerror',lambda error:errors.append(str(error)))
                  page.on('request',lambda r:writes.append(r.url) if '/sports-data/' in r.url and r.method not in ['GET','HEAD','OPTIONS'] else None)
                  for slug in ['premier-league','la-liga','brazil-serie-b','superliga'] if width==1440 else ['premier-league','superliga']:
                      row={'width':width,'slug':slug,'tabs':{}}
                      try:
                          page.goto('https://ninkosports.com/football/'+slug,wait_until='domcontentloaded',timeout=45000)
                          page.get_by_role('tab',name='News',exact=True).wait_for(timeout=20000)
                          for tab in ['Fixtures','Results','Standings']:
                              page.get_by_role('tab',name=tab,exact=True).click()
                              panel=page.locator('.news-football-data');panel.wait_for()
                              page.wait_for_function("document.querySelector('.news-football-data')?.getAttribute('aria-busy') === 'false'",timeout=45000)
                              dimensions=page.evaluate('({page:document.documentElement.scrollWidth,viewport:innerWidth})')
                              tabrow={'matches':panel.locator('.news-data-match').count(),'table_rows':panel.locator('tbody tr').count(),'alerts':panel.locator('[role=alert]').count(),'dimensions':dimensions,'text':panel.inner_text()[:450]}
                              row['tabs'][tab]=tabrow
                              if tabrow['alerts'] or dimensions['page']>width+3:failures.append({'slug':slug,'width':width,'tab':tab,**tabrow})
                              if tab=='Standings' and slug in ['premier-league','la-liga','brazil-serie-b'] and tabrow['table_rows']<10:failures.append({'slug':slug,'width':width,'reason':'missing_known_table'})
                              if tab=='Standings':panel.scroll_into_view_if_needed();page.screenshot(path=str(root/f'{width}-{slug}-standings.png'),full_page=True)
                          page.get_by_role('tab',name='News',exact=True).click()
                          if page.locator('.news-football-data').count():failures.append({'slug':slug,'width':width,'reason':'data_tab_did_not_unmount'})
                          if slug=='premier-league':
                              card=page.locator('a[href^="/article/"]').first
                              if card.count():
                                  card.click();page.locator('h1').wait_for(timeout=20000)
                                  row['article_title']=page.locator('h1').inner_text()
                                  row['loaded_content_images']=page.locator('main img').evaluate_all('(imgs)=>imgs.filter(i=>i.complete&&i.naturalWidth>100).length')
                                  page.screenshot(path=str(root/f'{width}-article.png'),full_page=True)
                      except Exception as e:row['error']=str(e)[:300];failures.append({'slug':slug,'width':width,'error':row['error']})
                      results.append(row);(root/'results.json').write_text(json.dumps(results,indent=2))
                  if errors:failures.append({'width':width,'page_errors':errors})
                  if writes:failures.append({'width':width,'unexpected_sports_write_requests':writes})
                  page.close()
              browser.close()
          summary={'checked_pages':len(results),'tab_checks':sum(len(r['tabs']) for r in results),'failures':failures,'real_public_origin':True,'mocked_requests':False}
          (root/'summary.json').write_text(json.dumps(summary,indent=2));print(json.dumps(summary,indent=2));assert not failures,failures
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-news-production-browser-20261003
          path: browser-evidence/
          retention-days: 7
