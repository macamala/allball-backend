name: Football News native JLeague evidence 20261003
on:
  push:
    branches: [audit/news-throughput-20261003]
    paths: [.github/workflows/news-jleague-native-proof-20261003.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      NINKO_SKIP_STARTUP_INDEX: '1'
      NINKO_SKIP_INTEGRITY_BACKFILL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6e975006a52aff1f45db2a047a233faed28de907
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - name: Robots-aware public pages only, no hidden or paid source bodies
        run: |
          mkdir -p jleague-evidence
          python - <<'PY'
          import json,pathlib,re,logging
          from html.parser import HTMLParser
          from collections import Counter
          from bot.news_feed_http import read_news_feed
          from bot.news_official_indexes import _anchor_candidates,_hydrate
          from bot.extract import article_text_from_html,page_published_at_from_html,page_title_from_html,collect_page_image_candidates
          logging.basicConfig(level=logging.WARNING)
          root=pathlib.Path('jleague-evidence')
          class Structure(HTMLParser):
              def __init__(self):super().__init__();self.stack=[];self.paths=[];self.meta=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag in {'meta','time','h1','h2','p'}:self.meta.append([tag,a,self.stack[-5:]])
                  if tag not in {'meta','img','input','br','hr','link','source','area','base','embed','wbr','track','col','param'}:self.stack.append([tag,{k:a[k] for k in ['id','class','itemprop'] if k in a}])
              def handle_endtag(self,tag):
                  for i in range(len(self.stack)-1,-1,-1):
                      if self.stack[i][0]==tag:self.stack=self.stack[:i];break
          for tier in [1,2]:
              cfg={'id':f'jleague-native-j{tier}','publisher':'J.LEAGUE','sport':'football','url':f'https://www.jleague.jp/j{tier}/news/','host':'www.jleague.jp','paths':('/news/article/',),'article_path_re':r'^/news/article/\d+/?$'}
              result={'config':cfg,'samples':[]}
              try:
                  index=read_news_feed(cfg['url']).decode('utf-8','replace');(root/f'j{tier}-index.html').write_text(index)
                  links=_anchor_candidates(cfg);result['links']=links
                  for i,(url,title) in enumerate(links[:3]):
                      row={'url':url,'link_title':title}
                      try:
                          page=read_news_feed(url).decode('utf-8','replace');(root/f'j{tier}-{i}.html').write_text(page)
                          structure=Structure();structure.feed(page)
                          reasons=Counter();item=_hydrate(cfg,url,title,diagnostics=reasons)
                          row.update(title=page_title_from_html(page),published_at=str(page_published_at_from_html(page)),body=article_text_from_html(page),metadata=structure.meta,images=collect_page_image_candidates(page)[:6],hydrated=bool(item),rejections=dict(reasons))
                          if item:row['item']=item
                      except Exception as e:row['error']=type(e).__name__+': '+str(e)[:150]
                      result['samples'].append(row)
              except Exception as e:result['error']=type(e).__name__+': '+str(e)[:150]
              (root/f'j{tier}.json').write_text(json.dumps(result,ensure_ascii=False,default=str,indent=2));print(cfg['id'],result.get('error'),len(result['samples']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-jleague-native-proof-20261003
          path: jleague-evidence/
          retention-days: 7
