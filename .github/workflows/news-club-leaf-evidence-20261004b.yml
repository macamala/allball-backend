name: News club leaf evidence B
on:
  push:
    branches: [audit/news-football-completion-20261004]
    paths: [.github/workflows/news-club-leaf-evidence-20261004b.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      NEWS_WORKER_ENABLED: '0'
      RESULTS_WRITE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -q -r requirements.txt
      - name: Verify bounded same-article source evidence
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json,re
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          from bot.news_feed_http import read_news_feed
          from bot.extract import article_text_from_html,page_title_from_html,page_published_at_from_html,collect_page_image_candidates
          from bot.news_official_indexes import _anchor_candidates
          configs=[{'id':'city-men','url':'https://www.mancity.com/news/mens','host':'www.mancity.com','paths':('/news/mens/',),'article_path_re':r'^/news/mens/[^/]+-\d+/?$'}, {'id':'city-women','url':'https://www.mancity.com/news/womens','host':'www.mancity.com','paths':('/news/womens/',),'article_path_re':r'^/news/womens/[^/]+-\d+/?$'}, {'id':'juventus','url':'https://www.juventus.com/en/news/articles/','host':'www.juventus.com','paths':('/en/news/articles/',),'article_path_re':r'^/en/news/articles/[^/]+/?$'}]
          def probe(config):
              output={'id':config['id'],'config':config,'items':[]}
              try:
                  links=_anchor_candidates(config)
                  output['discovered']=len(links)
                  for index,(url,title) in enumerate(links[:3]):
                      raw=read_news_feed(url);html=raw.decode('utf-8','replace')
                      Path('evidence/'+config['id']+'-'+str(index)+'.html').write_bytes(raw)
                      body=article_text_from_html(html)
                      output['items'].append({'url':url,'title':page_title_from_html(html) or title,'date':str(page_published_at_from_html(html)),'words':len(body.split()),'body_start':body[:650],'images':collect_page_image_candidates(html)[:2]})
              except Exception as error:output['error']=type(error).__name__+':'+str(error)[:180]
              return output
          reports=list(ThreadPoolExecutor(max_workers=3).map(probe,configs))
          Path('evidence/report.json').write_text(json.dumps(reports,ensure_ascii=False,indent=2))
          for report in reports:print('CLUB_LEAF',json.dumps(report,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-club-leaf-evidence-b
          path: evidence/
          retention-days: 7
