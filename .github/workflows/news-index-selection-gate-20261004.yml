name: News unseen index selection gate
on:
  push:
    branches: [audit/news-football-completion-20261004]
    paths:
      - .github/workflows/news-index-selection-gate-20261004.yml
      - audit/apply_news_index_selection_20261004.py
      - tests/test_news_index_selection_20261004.py
      - bot/news_index_selection.py
permissions:
  contents: write
concurrency:
  group: news-index-selection-audit-20261004
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      NEWS_ACCOUNTING_BACKEND: memory
      NEWS_WORKER_ENABLED: '0'
      RESULTS_COLLECTION_ENABLED: 'false'
      RESULTS_WRITE_ENABLED: 'false'
      RESULTS_SCHEDULER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -q -r requirements.txt
      - name: Integrate pre-quota selection on isolated audit branch only
        run: |
          python audit/apply_news_index_selection_20261004.py
          git diff --check
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed <= {'bot/news_official_indexes.py'},changed
          print('NEWS_ONLY_SELECTION_SCOPE',sorted(changed))
          PY
      - name: Retained News and new unseen-source regression gate
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings tests/test_news*.py tests/test_editorial*.py tests/test_rewrite*.py tests/test_public*.py tests/test_taxonomy*.py --tb=short | tee news-index-selection-tests.txt
      - name: Save verified source-selection integration without deployment
        run: |
          test "$GITHUB_REF_NAME" = 'audit/news-football-completion-20261004'
          git config user.name 'NinkoSports News maintenance'
          git config user.email '79318740+macamala@users.noreply.github.com'
          git add bot/news_official_indexes.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix(news): exclude known and confirmed-stale links before index hydration quota'
            git push origin HEAD:refs/heads/audit/news-football-completion-20261004
          fi
          git rev-parse HEAD | tee tested-news-commit.txt
          git archive --format=zip --output=tested-news-source.zip HEAD
          git diff f46b9d98fb67a1ce69c30e9c8fddf8d90a735e09 HEAD -- bot/ > news-index-selection-diff.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-index-selection-tested-evidence
          path: |
            news-index-selection-tests.txt
            tested-news-commit.txt
            tested-news-source.zip
            news-index-selection-diff.txt
          retention-days: 7
