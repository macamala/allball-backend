name: News candidate regressions

on:
  pull_request:
    paths:
      - "bot/**"
      - "sports_registry/news_aliases.py"
      - "news_runtime.py"
      - "deploy/news/**"
      - "tests/test_news_*.py"
      - ".github/workflows/news-candidate-regressions.yml"

jobs:
  news-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend requirements
        run: python -m pip install -r requirements.txt
      - name: Run isolated News candidate regressions
        run: >-
          python -m pytest -q
          tests/test_news_free_ai.py
          tests/test_news_deploy_contract.py
          tests/test_news_data_news.py
          tests/test_news_official_indexes.py
          tests/test_news_verified_sources.py
          tests/test_news_scheduler_lanes.py
          tests/test_news_translations.py
