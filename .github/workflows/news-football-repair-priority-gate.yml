name: News football repair priority gate
on:
  push:
    branches: [audit/news-football-completion-20261004]
    paths:
      - .github/workflows/news-football-repair-priority-gate.yml
      - audit/apply_news_repair_priority_20261004.py
      - tests/test_news_repair_priority_20261004.py
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      NEWS_ACCOUNTING_BACKEND: memory
      NEWS_WORKER_ENABLED: '0'
      RESULTS_COLLECTION_ENABLED: 'false'
      RESULTS_WRITE_ENABLED: 'false'
      RESULTS_SCHEDULER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -q -r requirements.txt
      - name: Apply selection-only repair without increasing row or AI budgets
        run: |
          python audit/apply_news_repair_priority_20261004.py
          git diff --check
          git diff -- public_index.py
          python - <<'PY'
          import subprocess
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()) <= {'public_index.py'}
          PY
      - name: Full retained News regression gate
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings tests/test_news*.py tests/test_editorial*.py tests/test_rewrite*.py tests/test_public*.py tests/test_taxonomy*.py --tb=short | tee news-priority-regression.txt
      - name: Recheck only the three inconclusive photo requests without AI or writes
        if: always()
        run: |
          python - <<'PY'
          import json
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          import httpx
          from bot.news_image_http import probe_news_image,USER_AGENT,_looks_like_image_bytes,_image_geometry_reason
          from bot.news_feed_http import validate_public_url
          urls={22782:'https://thumbs.smartframe.io/1ffbae35d432d0d71911ca2a0b209fbb/prsiL0i7PwCj.webp?force-scraper=rss&amp;t=rss',22730:'https://thumbs.smartframe.io/04742eb90cefa12a5e3ab9bae92c2b93/neimJYPkw5U1.webp?force-scraper=rss&amp;t=rss',22739:'https://thumbs.smartframe.io/1ffbae35d432d0d71911ca2a0b209fbb/prsiKbkYyTEY.webp?force-scraper=rss&amp;t=rss'}
          def check(pair):
              article_id,url=pair
              result={'id':article_id,'url':url,'probe':probe_news_image(url)}
              if not result['probe'][0]:
                  try:
                      validate_public_url(url)
                      with httpx.Client(timeout=6,follow_redirects=False,headers={'User-Agent':USER_AGENT}) as client:
                          with client.stream('GET',url) as response:
                              result['direct_status']=response.status_code
                              result['type']=response.headers.get('content-type')
                              if response.status_code==200:
                                  data=bytearray()
                                  for chunk in response.iter_bytes():
                                      data.extend(chunk)
                                      if len(data)>=128*1024:break
                                  result['image_bytes']=_looks_like_image_bytes(data)
                                  result['geometry_reason']=_image_geometry_reason(data,url)
                  except Exception as error:result['transport_error']=type(error).__name__
              return result
          checks=list(ThreadPoolExecutor(max_workers=3).map(check,urls.items()))
          print('PHOTO_RECHECK',json.dumps(checks))
          Path('photo-recheck.json').write_text(json.dumps(checks,indent=2))
          PY
      - name: Save regression-verified News-only selection fix
        run: |
          test "$GITHUB_REF_NAME" = 'audit/news-football-completion-20261004'
          git config user.name 'NinkoSports News maintenance'
          git config user.email '79318740+macamala@users.noreply.github.com'
          git add public_index.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix(news): prevent other-sport archive from starving football editorial repairs'
            git push origin HEAD:refs/heads/audit/news-football-completion-20261004
          fi
          git rev-parse HEAD | tee tested-news-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-football-priority-gate-evidence
          path: |
            news-priority-regression.txt
            tested-news-commit.txt
            photo-recheck.json
          retention-days: 7
